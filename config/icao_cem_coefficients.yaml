      - {intercept: 2377.4387281701015,  slope: 5.65391816142863}
      - {intercept: -2458.5703909997355, slope: 6.7860701762017186}
    breakpoints: [4271.5192448242833, null]
    payload_t: 26.4
    seats: 330

  # --- Single-segment types used for the Piano-X cross-validation (Step 3) ---
  # These are the ICAO/CORSIA GCD-input formulas quoted in the Piano-X report.

  A388:
    name: Airbus A380-800
    # Two ICAO/CORSIA GCD formulas are quoted in the Piano-X report for this
    # airframe (one at 6 000 km, one at 14 075 km). The breakpoint below is the
    # intersection of the two lines, i.e. the value that makes the piecewise
    # model continuous: d* = (4210.581 + 26598.33) / (18.153 - 14.381).
    segments:
      - {intercept: 4210.581,  slope: 14.381}
      - {intercept: -26598.33, slope: 18.153}
    breakpoints: [8167.79, null]
    payload_t: 84.0
    seats: 519

